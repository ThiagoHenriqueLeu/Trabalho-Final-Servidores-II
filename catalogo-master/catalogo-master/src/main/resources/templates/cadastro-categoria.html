<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Categoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>
<div sec:authorize="hasRole('ADMIN')">
    <nav class="navbar navbar-dark app-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/produtos}">FATEC Catalogo</a>
        </div>
    </nav>

    <main class="container app-shell">
        <div class="panel form-panel mx-auto">
            <div class="panel-header">
                <div>
                    <h2 class="page-title">Nova Categoria</h2>
                    <p class="page-subtitle">Organize os produtos por grupo de consulta.</p>
                </div>
            </div>

            <div class="panel-body">
                <form th:action="@{/categorias/salvar}" th:object="${categoria}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nome da Categoria</label>
                        <input type="text"
                               th:field="*{nome}"
                               class="form-control"
                               placeholder="Ex: Informatica, Papelaria..."
                               required>
                        <div class="text-danger compact-help mt-1"
                             th:if="${#fields.hasErrors('nome')}"
                             th:errors="*{nome}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Categoria</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
