<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>
<div sec:authorize="hasRole('ADMIN')">
    <nav class="navbar navbar-dark app-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/produtos}">FATEC Catalogo</a>
        </div>
    </nav>

    <main class="container app-shell">
        <div class="panel form-panel mx-auto">
            <div class="panel-header">
                <div>
                    <h2 class="page-title">Novo Usuario</h2>
                    <p class="page-subtitle">Defina as credenciais e o perfil de acesso.</p>
                </div>
            </div>

            <div class="panel-body">
                <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" th:field="*{password}" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Perfil de Acesso</label>
                        <select th:field="*{role}" class="form-select">
                            <option value="ROLE_USER">Usuario Comum</option>
                            <option value="ROLE_ADMIN">Administrador</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
