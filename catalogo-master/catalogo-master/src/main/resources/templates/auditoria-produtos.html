<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Auditoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>
<div sec:authorize="hasRole('ADMIN')">
    <nav class="navbar navbar-dark app-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/produtos}">FATEC Catalogo</a>
        </div>
    </nav>

    <main class="container app-shell">
        <div class="panel">
            <div class="panel-header">
                <div>
                    <h2 class="page-title">Auditoria de Estoque</h2>
                    <p class="page-subtitle">Produtos ordenados pela ultima atualizacao registrada.</p>
                </div>
                <a th:href="@{/produtos}" class="btn btn-outline-secondary">Voltar</a>
            </div>

            <div class="panel-body">
                <div class="table-responsive border rounded">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Ultima Atualizacao</th>
                            <th>Status</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="p : ${produtos}" th:classappend="${p.quantidade < 5} ? 'table-danger' : ''">
                            <td th:text="${p.idProduto}"></td>
                            <td th:text="${p.nome}"></td>
                            <td th:text="${p.categoria != null ? p.categoria.nome : 'Sem categoria'}"></td>
                            <td>
                                <span class="badge bg-danger" th:if="${p.quantidade < 5}" th:text="${p.quantidade}"></span>
                                <span class="badge bg-success" th:if="${p.quantidade >= 5}" th:text="${p.quantidade}"></span>
                            </td>
                            <td th:text="${#temporals.format(p.dataCadastro, 'dd/MM/yyyy HH:mm:ss')}"></td>
                            <td>
                                <span class="badge bg-danger" th:if="${p.quantidade < 5}">ESTOQUE BAIXO</span>
                                <span class="badge bg-success" th:if="${p.quantidade >= 5}">NORMAL</span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="6" class="empty-state">Nenhum produto cadastrado.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
