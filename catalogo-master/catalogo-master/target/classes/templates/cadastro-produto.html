<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>
<div sec:authorize="hasRole('ADMIN')">
    <nav class="navbar navbar-dark app-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/produtos}">FATEC Catalogo</a>
        </div>
    </nav>

    <main class="container app-shell">
        <div class="panel form-panel mx-auto">
            <div class="panel-header">
                <div>
                    <h2 class="page-title">Novo Produto</h2>
                    <p class="page-subtitle">Informe os dados comerciais e a posicao de estoque.</p>
                </div>
            </div>

            <div class="panel-body">
                <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                    <input type="hidden" th:field="*{idProduto}">

                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nome do Produto</label>
                        <input type="text"
                               th:field="*{nome}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Valor (R$)</label>
                        <input type="number"
                               step="0.01"
                               th:field="*{valor}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantidade</label>
                        <input type="number"
                               min="0"
                               th:field="*{quantidade}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('quantidade')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <select th:field="*{categoria}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid' : ''">
                            <option value="" disabled selected>Selecione uma categoria...</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.idCategoria}"
                                    th:text="${cat.nome}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
