<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/produtos}">FATEC Catalogo</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/produtos}">Produtos</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/categorias/novo}">Nova Categoria</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/usuarios/novo}">Novo Usuario</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/produtos/auditoria}">Auditoria</a>
                </li>
            </ul>

            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3" sec:authorize="isAuthenticated()">
                    Ola, <strong sec:authentication="name">Usuario</strong>
                </span>

                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <button class="btn btn-light btn-sm text-primary fw-bold">Sair</button>
                </form>

                <a class="btn btn-light btn-sm" th:href="@{/login}" sec:authorize="!isAuthenticated()">Entrar</a>
            </div>
        </div>
    </div>
</nav>

<main class="container app-shell">
    <div class="panel">
        <div class="panel-header">
            <div>
                <h2 class="page-title">Produtos</h2>
                <p class="page-subtitle">Consulta, estoque e operacoes do catalogo.</p>
            </div>

            <a th:href="@{/produtos/novo}" class="btn btn-success" sec:authorize="hasRole('ADMIN')">
                Novo Produto
            </a>
        </div>

        <div class="panel-body">
            <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${sucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>

            <form th:action="@{/produtos}" method="get" class="toolbar mb-4">
                <div class="row g-2">
                    <div class="col-md-6">
                        <input type="text"
                               name="nome"
                               class="form-control"
                               placeholder="Buscar produto..."
                               th:value="${param.nome}">
                    </div>

                    <div class="col-md-4">
                        <select name="categoriaId" class="form-select">
                            <option value="">Todas Categorias</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.idCategoria}"
                                    th:text="${cat.nome}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-primary w-100">Filtrar</button>
                    </div>
                </div>
            </form>

            <div class="table-responsive border rounded">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Quantidade</th>
                        <th>Preco</th>
                        <th sec:authorize="hasRole('ADMIN')">Acoes</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="p : ${produtos}" th:classappend="${p.quantidade < 5} ? 'low-stock-row' : ''">
                        <td th:text="${p.idProduto}"></td>
                        <td th:text="${p.nome}"></td>
                        <td th:text="${p.categoria != null ? p.categoria.nome : 'Sem categoria'}"></td>
                        <td>
                            <span th:if="${p.quantidade < 5}" class="badge bg-danger" th:text="${p.quantidade}"></span>
                            <span th:if="${p.quantidade >= 5}" class="badge bg-success" th:text="${p.quantidade}"></span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(p.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/produtos/editar/{id}(id=${p.idProduto})}" class="btn btn-info text-white btn-sm">
                                Editar
                            </a>
                            <a th:href="@{/produtos/excluir/{id}(id=${p.idProduto})}"
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('Excluir produto?')">
                                Excluir
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="6" class="empty-state">Nenhum produto encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    setTimeout(() => {
        const alert = document.querySelector('.alert-success');
        if (alert) {
            alert.remove();
        }
    }, 5000);
</script>
</body>
</html>
