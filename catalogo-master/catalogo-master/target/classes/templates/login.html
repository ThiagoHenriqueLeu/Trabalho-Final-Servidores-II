<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catalogo Fatec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="login-page">
    <section class="panel login-card">
        <div class="login-brand">
            <h1>Catalogo Fatec</h1>
            <p>Acesso restrito para gestao de produtos.</p>
        </div>

        <div class="panel-body">
            <div th:if="${param.error}" class="alert alert-danger">
                Usuario ou senha invalidos.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                Sessao encerrada com sucesso.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="admin" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-control" placeholder="admin123" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
